# Configuration de sécurité du framework
# Ces propriétés définissent les noms des variables de session utilisées
# pour l'authentification et les rôles

# Nom de la variable de session qui indique si l'utilisateur est authentifié
# Exemple: session.setAttribute("user", monObjetUser) ou session.setAttribute("auth", true)
security.session.auth=auth

# Nom de la variable de session qui contient le(s) rôle(s) de l'utilisateur
# Peut être une String ("admin") ou un String[] ({"admin", "user"}) ou Collection
security.session.role=role
